name: Prose Linting (Vale)

on:
  push:
    branches:
      - main
  pull_request:

# reviewdog posts findings as PR review comments, so it needs write on pull-requests.
permissions:
  contents: read
  pull-requests: write

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Vale
        uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0 (reviewdog branch head)
        with:
          vale_flags: "--no-wrap"
          # reviewdog only annotates by default; fail the job on an error in the added lines.
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
