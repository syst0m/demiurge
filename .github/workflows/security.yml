name: Security & Secret Scanning

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# gitleaks-action lists the PR's commits, which the default token cannot do in this
# repo. Without these it fails with 403 'Resource not accessible by integration',
# which reads as a leak and is not one.
permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep SAST & Agent Policy Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
            .semgrep/agent-security.yml
