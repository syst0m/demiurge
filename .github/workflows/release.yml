name: Release

# A merge to main that adds a new CHANGELOG.md version tags and releases it. A tag pushed by hand
# (`python scripts/verify_release.py --cut` in LOCAL mode) releases too. Tags created here use GITHUB_TOKEN, so they
# do not trigger this workflow again.
on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=${GITHUB_REF_NAME}
          else
            TAG=v$(python scripts/verify_release.py --latest-version)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/verify_release.py --notes "${TAG#v}" > release_notes.md

      - name: Create Release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          generate_release_notes: true
