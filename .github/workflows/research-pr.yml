name: Research PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    outputs:
      upgrade: ${{ steps.diff.outputs.rc == '10' }}
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: |
          # Written to a file first, so a failing git diff fails the step instead of reading as "no research change".
          git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"
          if grep -qE '^(research/|skills/marcus/references/|skills/marcus/AGENT_ARCHITECTURE\.md$)' "$RUNNER_TEMP/changed.txt"; then
            echo "research=true" >> "$GITHUB_OUTPUT"
          else
            echo "No research changes; research-approval passes."
            echo "research=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.research == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - if: steps.scope.outputs.research == 'true'
        run: |
          git worktree add gate "origin/$BASE_REF"
          # Packages come from the base ref too, so a pull request cannot swap what the gate scripts import.
          if [ -f gate/requirements-dev.txt ]; then
            python -m pip install -r gate/requirements-dev.txt
          fi
      - name: Research branch scope
        if: steps.scope.outputs.research == 'true' && startsWith(github.head_ref, 'research/')
        run: |
          if [ ! -f gate/scripts/research/sweep_pr.py ]; then
            echo "::notice::Base branch has no scripts/research/sweep_pr.py; bootstrap run passes."
            exit 0
          fi
          python gate/scripts/research/sweep_pr.py --repo . --base "origin/$BASE_REF" check-scope
      - if: steps.scope.outputs.research == 'true'
        id: diff
        run: |
          if [ ! -f gate/scripts/research/claims_diff.py ]; then
            echo "::notice::Base branch has no scripts/research/claims_diff.py; bootstrap run passes."
            echo "rc=bootstrap" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python gate/scripts/research/grade_cap.py --repo . --check
          python gate/scripts/research/grade_cap.py --repo . --check-changelog --base "origin/$BASE_REF"
          rc=0
          python gate/scripts/research/claims_diff.py --repo . --base "origin/$BASE_REF" --head HEAD --json > diff.json || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 10 ] || exit "$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Upgrade verification records
        if: steps.diff.outputs.rc == '10'
        run: python gate/scripts/research/check_verifications.py --repo . --diff diff.json --claims skills/marcus/references/claims.json --dir research/verifications

  # The owner approves on the pull request with "Review deployments". Only a reviewer listed on the
  # research-approval environment can click it, and a new push starts a new run that needs a new click.
  approve:
    needs: analyze
    if: needs.analyze.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    environment: research-approval
    steps:
      - run: echo "Owner approved this upgrade for ${{ github.event.pull_request.head.sha }}."

  research-approval:
    needs: [analyze, approve]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          ANALYZE: ${{ needs.analyze.result }}
          APPROVE: ${{ needs.approve.result }}
        run: |
          [ "$ANALYZE" = success ] || { echo "::error::analysis $ANALYZE"; exit 1; }
          [ "$APPROVE" = success ] || [ "$APPROVE" = skipped ] || { echo "::error::owner approval $APPROVE"; exit 1; }
