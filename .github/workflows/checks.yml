name: Repo Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python scripts/run_unit_tests.py
      - name: Marcus gate regression suite
        run: python skills/marcus/evals/run_gate_tests.py --library skills
      - name: G4 validation (buckminster; marcus runs inside update_marcus)
        run: |
          rc=0
          python skills/marcus/scripts/validate_skill.py skills/buckminster || rc=$?
          [ "$rc" -le 1 ] || exit "$rc"
      - name: Links
        run: python scripts/check_links.py --strict
      - name: Research distribution drift
        run: bash scripts/sync-skills.sh --check --repo-only
      - name: Claims ledger caps
        run: python scripts/research/grade_cap.py --check
      - name: Claims change log is append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/research/grade_cap.py --check-changelog --base "origin/$BASE_REF"
      - name: Rule citations
        run: python scripts/research/check_rule_citations.py
      - name: Repo skill registry parse
        run: python scripts/registry/build_registry.py --repo-only --check
      - name: Marcus sync check
        run: python skills/marcus/scripts/update_marcus.py --check
      - name: Superfluous-comment scan
        run: python scripts/scan_superfluous.py
  pre-commit:
    runs-on: ubuntu-latest
    env:
      SKIP: vale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pre_commit run --all-files --show-diff-on-failure
