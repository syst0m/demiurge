repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.35.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
  - repo: https://github.com/errata-ai/vale
    rev: v3.4.1
    hooks:
      - id: vale

  # Local deterministic security, PII, and agent safety scan
  - repo: local
    hooks:
      - id: scan-security-pii
        name: Scan for secrets, PII, and agent safety
        entry: python scripts/scan_security_and_pii.py
        language: system
        pass_filenames: true
      - id: gate-tropes
        name: Scan for negative parallelism
        entry: python scripts/gate_tropes.py
        language: system
        types: [markdown]

      - id: scan-superfluous
        name: Scan for superfluous commentary and session transcripts
        entry: python scripts/scan_superfluous.py
        language: system
        pass_filenames: true
