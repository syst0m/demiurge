# Vendored upstream files stay byte-identical to their pin (scripts/vendor_sync.py); no hook may rewrite them.
exclude: ^skills/[^/]+/references/[^/]+/(SKILL\.upstream\.md|LICENSE)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Symlink blobs must stay byte-exact; a trailing newline breaks the target
        exclude: ^\.claude/skills/
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.35.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
  - repo: https://github.com/errata-ai/vale
    rev: v3.4.1
    hooks:
      - id: vale

  # Local deterministic security, PII, and agent safety scan
  - repo: local
    hooks:
      - id: scan-security-pii
        name: Scan for secrets, PII, and agent safety
        entry: python scripts/scan_security_and_pii.py
        language: system
        pass_filenames: true
      - id: gate-tropes
        name: Scan for negative parallelism
        entry: python scripts/gate_tropes.py
        language: system
        types: [markdown]

      - id: scan-superfluous
        name: Scan for superfluous commentary and session transcripts
        entry: python scripts/scan_superfluous.py
        language: system
        pass_filenames: true

      - id: gate-release
        name: Verify release integrity and prevent [skip ci] on releases
        entry: python scripts/verify_release.py --pre-commit
        language: system
        pass_filenames: true

      - id: vendor-pins
        name: Vendored upstream files match their pins
        entry: python scripts/vendor_sync.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: harness-parity
        name: Every skill is deployed in every installed harness
        entry: python scripts/check_harness_parity.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: bundle-parity
        name: The baseline-coding bundle is materialized and current
        entry: python scripts/sync_bundles.py --bundle baseline-coding --check
        language: system
        pass_filenames: false
        always_run: true
