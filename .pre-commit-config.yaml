repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.35.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
  - repo: https://github.com/errata-ai/vale
    rev: v3.4.1
    hooks:
      - id: vale

  # Local deterministic security, PII, and agent safety scan
  - repo: local
    hooks:
      - id: scan-security-pii
        name: Scan for secrets, PII, and agent safety
        entry: python scripts/scan_security_and_pii.py
        language: system
        pass_filenames: true

      # Versioned here rather than living only in .git/hooks/, where it was
      # unversioned, invisible to CI, and would be displaced by `pre-commit install`.
      - id: gate-tropes
        name: Scan for negative parallelism
        entry: scripts/gate-tropes.sh
        language: script
        types: [markdown]
